name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    permissions:
      # python-coverage-comment-action がバッジ用データブランチへ push するために必要
      contents: write
      # 同一リポジトリからの PR にカバレッジコメントを投稿するために必要
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # uv は .python-version(3.11)を setup-python のインタプリタより優先する
      # ため、マトリクスのバージョンを環境変数で明示する。uv run の暗黙の
      # 再 sync にも効かせるため、ステップ引数ではなくジョブレベルで設定する。
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: pytest
      - name: Sync dependencies
        run: uv sync --extra test --extra format --extra package --extra docs
      - name: Verify the venv Python matches the matrix
        run: uv run python -c "import sys; assert '${{ matrix.python-version }}' == f'{sys.version_info[0]}.{sys.version_info[1]}', sys.version"
      - name: Build docs
        run: uv run --extra docs mkdocs build --strict
      - name: Install Playwright browser
        run: uv run playwright install chromium
      - name: Run non-browser tests
        run: uv run python -m pytest test/ -m 'not (browser or binary)' -n auto --cov
      - name: Run browser tests
        run: uv run python -m pytest test/chilmai/browser -m browser -n 1 --cov --cov-append
      - name: Write coverage job summary
        if: matrix.python-version == '3.12'
        run: |
          {
            echo "## Coverage"
            echo ""
            echo "**Total: $(uv run coverage report --format=total)%**"
            echo ""
            echo "<details><summary>File-level report</summary>"
            echo ""
            uv run coverage report --format=markdown
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage comment
        id: coverage_comment
        if: matrix.python-version == '3.12'
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      # フォークからの PR では GITHUB_TOKEN にコメント権限がないため、
      # コメント本文をアーティファクトとして保存し coverage_comment.yml が投稿する
      - name: Store PR comment to be posted
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.12' && steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
