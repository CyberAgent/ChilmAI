name: pyinstaller build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHONUTF8: 1

jobs:
  pyinstaller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: pyinstaller
      - name: Sync dependencies
        run: uv sync --extra package --extra test
      - name: Build with PyInstaller
        run: uv run python apps/packager.py
      - name: Check built binary exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ChilmAI/ChilmAI.exe")) {
            Write-Error "Binary not found: dist/ChilmAI/ChilmAI.exe"
          }
      - name: Check local config is not packaged
        shell: pwsh
        run: |
          if (Test-Path "dist/ChilmAI/data/config.json") {
            Write-Error "Local config must not be packaged: dist/ChilmAI/data/config.json"
          }
      - name: Check license files are bundled
        shell: pwsh
        run: |
          $required = @(
            "LICENSE",
            "NOTICE",
            "TRADEMARK.md",
            "THIRD-PARTY-NOTICES.txt",
            "licenses/EPL-2.0.txt",
            "licenses/MPL-2.0.txt",
            "licenses/PyInstaller-COPYING.txt"
          )
          $missing = @()
          foreach ($name in $required) {
            $path = "dist/ChilmAI/$name"
            if (!(Test-Path $path)) { $missing += "$name (absent)"; continue }
            if ((Get-Item $path).Length -eq 0) { $missing += "$name (empty)" }
          }
          if ($missing) {
            throw "License files missing from distribution: $($missing -join ', ')"
          }
      - name: Check third-party notices cover bundled native code
        # インライン PowerShell ではなく Python にしてある。手元で実物に対して
        # 実行して検証できるため（PowerShell 版は CRLF と scalar/array の扱いで
        # 3 回落とした）。
        run: uv run python scripts/check_bundled_notices.py dist/ChilmAI
      - name: Check sample/ is placed next to the exe, not under _internal
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ChilmAI/sample/申込者データ_デモ.csv")) {
            Write-Error "Sample file not found next to exe: dist/ChilmAI/sample/申込者データ_デモ.csv"
          }
          if (!(Test-Path "dist/ChilmAI/sample/保育所データ_デモ.csv")) {
            Write-Error "Sample file not found next to exe: dist/ChilmAI/sample/保育所データ_デモ.csv"
          }
          if (Test-Path "dist/ChilmAI/_internal/sample") {
            Write-Error "Sample dir must not be packaged under _internal: dist/ChilmAI/_internal/sample"
          }
      - name: Check pytz zoneinfo data is not bundled
        shell: pwsh
        run: |
          $zoneinfo = Get-ChildItem -Path "dist/ChilmAI/_internal/pytz/zoneinfo" -Recurse -File -ErrorAction SilentlyContinue
          if ($zoneinfo) {
            Write-Error "pytz zoneinfo files must not be bundled: $($zoneinfo.Count) file(s) found"
          }
      - name: Run binary-marked tests (if any)
        shell: pwsh
        run: |
          uv run python -m pytest test/chilmai/binary -m binary -n 1
          if ($LASTEXITCODE -eq 5) {
            Write-Host "No binary tests found. Skipping."
            exit 0
          }
          exit $LASTEXITCODE
