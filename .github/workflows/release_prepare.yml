name: prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version component to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
          - stable

# テストと、リポジトリへの書き込みは別ジョブに分ける。テスト中に動く依存
# パッケージや Playwright のコードに、main へ push できるトークンや他の
# ワークフローを起動できるトークンを渡さないため。
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONUTF8: 1

jobs:
  test:
    name: Bump version and test
    runs-on: ubuntu-latest
    # release ジョブは needs: test なので、この条件で test が skip されれば
    # release も skip される
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: release-prepare
      - name: Bump project version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "${BUMP}" --no-sync
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Sync dependencies
        # --locked: uv version が更新した uv.lock をそのまま使い、pyproject.toml と
        # 食い違っていたら黙って再解決せず失敗させる
        run: uv sync --locked --extra test --extra format --extra package --extra docs
      - name: Build docs
        run: uv run --extra docs mkdocs build --strict -f mkdocs.yml
      - name: Run non-browser tests
        run: uv run python -m pytest test/ -m 'not (browser or binary)' -n auto
      - name: Install Playwright browser
        run: uv run playwright install chromium
      - name: Run browser tests
        run: uv run python -m pytest test/chilmai/browser -m browser -n 1

  release:
    name: Commit, tag, and trigger build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: release-prepare
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump project version
        # test ジョブと同じコミット（github.sha）に同じ bump を適用し直す。
        # プロジェクトのコードは実行せず、pyproject.toml と uv.lock の
        # バージョン行だけを書き換える。
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED_VERSION: ${{ needs.test.outputs.version }}
        run: |
          uv version --bump "${BUMP}" --no-sync
          version="$(uv version --short)"
          if [[ "${version}" != "${EXPECTED_VERSION}" ]]; then
            echo "Version mismatch: test job computed ${EXPECTED_VERSION}, release job computed ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}"; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi
          changed="$(git status --porcelain --untracked-files=all | awk '{ print $2 }' | sort)"
          expected="$(printf 'pyproject.toml\nuv.lock')"
          if [[ "${changed}" != "${expected}" ]]; then
            echo "Unexpected working tree changes:" >&2
            git status --porcelain --untracked-files=all >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Commit release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add pyproject.toml uv.lock
          git commit -m "chore: release ${TAG}"
      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git tag -a "${TAG}" -m "${TAG}"
      - name: Push release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "HEAD:${DEFAULT_BRANCH}"
          git push origin "${TAG}"
      # GITHUB_TOKEN によるタグ push は release_tag.yml の push トリガーを
      # 発火しないため、workflow_dispatch で明示的に起動する
      - name: Trigger release build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release_tag.yml --ref "${TAG}"
