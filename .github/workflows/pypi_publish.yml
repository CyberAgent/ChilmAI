name: publish to PyPI

# リリースタグを ref に指定して手動起動する（gh workflow run pypi_publish.yml --ref vX.Y.Z）。
# GITHUB_TOKEN によるタグ push や Release 公開はイベントを発火しないため、
# push / release トリガーでは起動できない。release_prepare.yml と同趣旨。
#
# ビルドと公開は別ジョブに分ける。id-token: write はジョブ単位の権限で、
# 同じジョブ内のどのステップからでも OIDC トークンを発行できてしまう。
# ビルド中に動く setuptools（PyPI から取得する）やプロジェクト自身のビルド
# コードに、PyPI へ任意の成果物を公開できる権限を渡さないための分離。
# PyPA のガイドも同じ構成を推奨している。
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: pypi-publish
      - name: Validate release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Run this workflow on a release tag ref, not ${GITHUB_REF_TYPE} ${tag}" >&2
            exit 1
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([a-z]+[0-9]+)?([.]post[0-9]+)?([.]dev[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          version="$(uv version --short)"
          if [[ "${tag#v}" != "${version}" ]]; then
            echo "Tag ${tag} does not match project version ${version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        # ビルド時に使う setuptools のバージョンは pyproject.toml の
        # [tool.uv] build-constraint-dependencies で固定している
        run: uv build
      - name: Check license files are bundled in the artifacts
        run: |
          sdist="$(ls dist/*.tar.gz)"
          wheel="$(ls dist/*.whl)"
          for name in LICENSE NOTICE TRADEMARK.md; do
            if ! tar -tzf "${sdist}" | grep -q "/${name}$"; then
              echo "License file missing from sdist: ${name}" >&2
              exit 1
            fi
            if ! unzip -l "${wheel}" | grep -q "${name}"; then
              echo "License file missing from wheel: ${name}" >&2
              exit 1
            fi
          done
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    # 起動には environment "pypi" の保護ルール（レビュアー承認など）が適用される。
    # PyPI 側の trusted publishing 設定はこの environment 名と一致させること。
    environment:
      name: pypi
      url: https://pypi.org/project/chilmai/
    permissions:
      # PyPI の trusted publishing（OIDC）に必要。このジョブはリポジトリを
      # checkout せず、build ジョブの成果物をそのまま公開するだけにする。
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
