name: release on tag push

on:
  push:
    tags:
      - "v*"
  # GITHUB_TOKEN によるタグ push は push イベントを発火しないため、
  # release_prepare.yml から gh workflow run --ref <tag> で起動する
  workflow_dispatch:

# ビルドと Release 公開は別ジョブに分ける。PyInstaller ビルド中に動く依存
# パッケージのコードに、リポジトリや Release を書き換えられるトークンを
# 渡さないため。contents: write は Release を作る release ジョブだけに付ける。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: 1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # 他ジョブと uv キャッシュの保存が競合しないようキーを分離する
          cache-suffix: release-tag
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([a-z]+[0-9]+)?([.]post[0-9]+)?([.]dev[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          version="$(uv version --short)"
          if [[ "${tag#v}" != "${version}" ]]; then
            echo "Tag ${tag} does not match project version ${version}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Sync dependencies
        # --locked: uv.lock が pyproject.toml と食い違っていたら黙って再解決せず
        # 失敗させる。リリースに入る依存はロック済みのものに限る。
        run: uv sync --locked --extra package
      - name: Build with PyInstaller
        run: uv run python apps/packager.py
      - name: Check built binary exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ChilmAI/ChilmAI.exe")) {
            Write-Error "Binary not found: dist/ChilmAI/ChilmAI.exe"
          }
      - name: Check local config is not packaged
        shell: pwsh
        run: |
          if (Test-Path "dist/ChilmAI/data/config.json") {
            Write-Error "Local config must not be packaged: dist/ChilmAI/data/config.json"
          }
      - name: Check license files are bundled
        shell: pwsh
        run: |
          $required = @(
            "LICENSE",
            "NOTICE",
            "TRADEMARK.md",
            "THIRD-PARTY-NOTICES.txt",
            "licenses/EPL-2.0.txt",
            "licenses/MPL-2.0.txt",
            "licenses/PyInstaller-COPYING.txt"
          )
          $missing = @()
          foreach ($name in $required) {
            $path = "dist/ChilmAI/$name"
            if (!(Test-Path $path)) { $missing += "$name (absent)"; continue }
            if ((Get-Item $path).Length -eq 0) { $missing += "$name (empty)" }
          }
          if ($missing) {
            throw "License files missing from distribution: $($missing -join ', ')"
          }
      - name: Check third-party notices cover bundled native code
        # インライン PowerShell ではなく Python にしてある。手元で実物に対して
        # 実行して検証できるため（PowerShell 版は CRLF と scalar/array の扱いで
        # 3 回落とした）。
        run: uv run python scripts/check_bundled_notices.py dist/ChilmAI
      # アセット名はバージョンを含めず固定にする。GitHub の
      # releases/latest/download/<アセット名> はアセット名の完全一致で解決する
      # ため、固定名にすることで常に最新リリースを指す永続リンクを README や
      # ドキュメントに書ける。バージョンはリリースのタグ（vX.Y.Z）・ZIP 内の
      # ルートフォルダ名・Web UI のヘッダー表示で追跡する。
      - name: Compress dist directory
        shell: pwsh
        run: |
          # ZIP 内のルートフォルダにはバージョンを含める。アセット名が固定でも、
          # 展開後のフォルダ名から手元のバージョンを識別できるようにする。
          $tag = "${{ steps.release.outputs.tag }}"
          Rename-Item -Path dist/ChilmAI -NewName "ChilmAI-${tag}"
          $zipPath = "dist/ChilmAI-latest.zip"
          Compress-Archive -Path "dist/ChilmAI-${tag}" -DestinationPath $zipPath
          $hash = Get-FileHash -Algorithm SHA256 $zipPath
          "$($hash.Hash.ToLower())  ChilmAI-latest.zip" | Set-Content -Path "${zipPath}.sha256" -Encoding ASCII
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/ChilmAI-latest.zip
            dist/ChilmAI-latest.zip.sha256
          if-no-files-found: error
          # 既に ZIP なので再圧縮しない
          compression-level: 0
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      # リポジトリは checkout しない。gh は --repo 指定で API を直接叩く。
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/
      - name: Create draft GitHub Release
        run: |
          gh release create "${TAG}" \
            --repo="$GITHUB_REPOSITORY" \
            --title="${TAG}" \
            --generate-notes \
            --verify-tag \
            --draft
      - name: Upload release assets
        run: |
          gh release upload "${TAG}" \
            "dist/ChilmAI-latest.zip" \
            "dist/ChilmAI-latest.zip.sha256" \
            --repo="$GITHUB_REPOSITORY"
      - name: Publish GitHub Release
        run: |
          gh release edit "${TAG}" \
            --repo="$GITHUB_REPOSITORY" \
            --draft=false
