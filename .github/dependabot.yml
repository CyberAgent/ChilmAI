version: 2
updates:
  # ワークフローのアクションはサプライチェーン対策として
  # .github/workflows/actions.lock（gh actions-lock が生成）でコミットに固定している。
  # Dependabot はタグの更新と同時に lockfile のエントリも更新する PR を出すので、
  # 追従はこれに任せる。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # アクションの更新は 1 本の PR にまとめる
      github-actions:
        patterns:
          - "*"
